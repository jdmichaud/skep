name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without a version, setup-zig installs the minimum_zig_version of
      # build.zig.zon, so Zig stays pinned in one place.
      - uses: mlugg/setup-zig@v2
      - run: zig build test
      - run: zig build test -Drelease
      # Fuzzing needs ReleaseSafe with Zig 0.17 (see doc/development.md).
      - run: zig build test -Drelease --fuzz=1M
      - run: zig build fmt-check

  release:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q . RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no notes for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # Static binaries for each architecture, their checksums and the
      # script that installs them: what install.sh downloads.
      - uses: mlugg/setup-zig@v2
      - run: tools/dist.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
