<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  skepd on the system bus, as its system unit runs it: as the skep user, which
  owns its name, publishing devices and their readings to the skep group and
  root, as its socket is theirs. Readings tell who is home: other users of the
  machine neither read them nor get their signals. skep-dbus(7) tells more.
-->
<busconfig>
  <policy user="skep">
    <allow own="zigbee.Skep1"/>
  </policy>
  <policy context="default">
    <deny send_destination="zigbee.Skep1"/>
    <deny receive_sender="zigbee.Skep1"/>
  </policy>
  <policy group="skep">
    <allow send_destination="zigbee.Skep1"/>
    <allow receive_sender="zigbee.Skep1"/>
  </policy>
  <policy user="root">
    <allow send_destination="zigbee.Skep1"/>
    <allow receive_sender="zigbee.Skep1"/>
  </policy>
</busconfig>
